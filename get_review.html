<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Axlrate - Session Review</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      background: #f7f7f7;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: #fff;
      margin: 2rem;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      position: relative;
    }

    h1 {
      text-align: center;
      font-size: 1.75rem;
      color: #333;
      margin-bottom: 1.5rem;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.5rem;
      color: #333;
    }

    .stars {
      display: flex;
      gap: 8px;
      font-size: 2rem;
      cursor: pointer;
      margin-bottom: 1rem;
      user-select: none;
    }

    .stars span {
      transition: color 0.2s;
      color: #ccc;
    }

    .stars span.selected {
      color: #2196f3;
    }

    textarea,
    input[type="range"] {
      width: 100%;
      padding: 0.875rem;
      border-radius: 8px;
      border: 1.5px solid #ddd;
      font-size: 1rem;
      margin-bottom: 1rem;
      box-sizing: border-box;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    #enjoymentLabel {
      margin-top: -0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      color: #555;
    }

    button {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #2196f3;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }

    .error {
      color: #e53935;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    .loader-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      justify-content: center;
      align-items: center;
    }

    .loader-overlay.active {
      display: flex;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(33, 150, 243, 0.1);
      border-top-color: #2196f3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    input[type="range"] {
      --thumb-size: 28px;
      --track-height: 12px;
      --thumb-offset: calc(var(--thumb-size) / 2);
      -webkit-appearance: none;
      width: 100%;
      height: var(--track-height);
      border-radius: 6px;
      background: #ddd;
      outline: none;
      margin-bottom: 1.5rem;
      transition: background 0.3s ease;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: var(--thumb-size);
      height: var(--thumb-size);
      background: #fff;
      border: 4px solid #2196f3;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(33, 150, 243, 0.6);
      margin-top: calc((var(--track-height) - var(--thumb-size)) / 2 + 8px);
    }

    input[type="range"]::-moz-range-thumb {
      width: var(--thumb-size);
      height: var(--thumb-size);
      background: #fff;
      border: 4px solid #2196f3;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(33, 150, 243, 0.6);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Session Review</h1>
    <form id="reviewForm">
      <label for="rating">Your Rating</label>
      <div class="stars" id="starContainer">
        <span>☆</span>
        <span>☆</span>
        <span>☆</span>
        <span>☆</span>
        <span>☆</span>
      </div>
      <input type="hidden" id="rating" required />

      <label for="enjoyment">How much fun did you have? 🎉</label>
      <input type="range" id="enjoyment" name="enjoyment" min="0" max="10" step="1" value="10" />
      <div id="enjoymentLabel">MAX FUN 🚀🎉</div>

      <label for="reviewText">Your Feedback</label>
      <textarea id="reviewText" placeholder="Write your review here..."></textarea>

      <div class="error" id="errorMsg"></div>
      <button type="submit" disabled>Submit Review</button>
    </form>

    <div id="loaderOverlay" class="loader-overlay">
      <div class="spinner"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc
    } from "https://www.gstatic.com/firebasejs/9.17.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJ1y6UoLSRF6BU8Z...",
      authDomain: "test-e984f.firebaseapp.com",
      projectId: "test-e984f",
      storageBucket: "test-e984f.appspot.com",
      messagingSenderId: "889266750184",
      appId: "1:889266750184:web:211328c90c4efc28bc3f5d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("reviewForm");
    const errorMsg = document.getElementById("errorMsg");
    const loaderOverlay = document.getElementById("loaderOverlay");
    const enjoymentInput = document.getElementById("enjoyment");
    const enjoymentLabel = document.getElementById("enjoymentLabel");
    const ratingInput = document.getElementById("rating");
    const starContainer = document.getElementById("starContainer");
    const submitBtn = form.querySelector("button[type=submit]");

    let ratingGiven = false;

    const funScale = [
      "Not fun at all 😐", "Barely fun 😕", "Could be better 😶", "Meh 😑", "Somewhat fun 🙂",
      "It was okay 🙂", "Good time 😄", "Really fun 😃", "Awesome 😎", "Super fun 🤩", "MAX FUN 🚀🎉"
    ];

    enjoymentInput.addEventListener("input", () => {
      enjoymentLabel.textContent = funScale[parseInt(enjoymentInput.value)] || "";
    });

    starContainer.querySelectorAll("span").forEach((star, index) => {
      star.addEventListener("click", () => {
        ratingInput.value = index + 1;
        ratingGiven = true;
        starContainer.querySelectorAll("span").forEach((s, i) => {
          s.textContent = i <= index ? "★" : "☆";
          s.classList.toggle("selected", i <= index);
        });
        checkFormValidity();
      });
    });

    const pathParts = window.location.pathname.split("/");
    const refPart = pathParts[pathParts.length - 1];
    const [session_id, user_id] = refPart.includes("_") ? refPart.split("_") : [null, null];

    function checkFormValidity() {
      if (!session_id || !user_id) {
        errorMsg.textContent = "Invalid review link. Missing session or user ID.";
        submitBtn.disabled = true;
        return;
      }

      if (!ratingGiven) {
        errorMsg.textContent = "Please select a rating.";
        submitBtn.disabled = true;
        return;
      }

      errorMsg.textContent = "";
      submitBtn.disabled = false;
    }

    checkFormValidity();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      checkFormValidity();

      if (submitBtn.disabled) return;

      loaderOverlay.classList.add("active");

      try {
        await addDoc(collection(db, "reviews"), {
          session_id,
          user_id,
          rating: parseInt(ratingInput.value),
          enjoyment: parseInt(enjoymentInput.value),
          review: document.getElementById("reviewText").value.trim(),
          created_at: new Date().toISOString()
        });

        // window.location.href = "rating_thanks.html";
      } catch (error) {
        console.error("Error submitting review:", error);
        errorMsg.textContent = "Failed to submit review. Try again.";
      } finally {
        loaderOverlay.classList.remove("active");
      }
    });
  </script>
</body>

</html>
